services:

  # ── Backend: FastAPI + tüm servisler ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NETGUARD_DB_PATH=/data/netguard.db
      - INFLUXDB_URL=http://influxdb:8086
      - NETGUARD_CORS_ORIGINS=https://localhost,https://127.0.0.1,https://${NETGUARD_HOST:-localhost}
      - NETGUARD_INTERFACE=eth0
      - DATABASE_URL=postgresql://netguard:${POSTGRES_PASSWORD:-netguard_dev}@postgres:5432/netguard
      - ZEEK_LOG_DIR=/zeek-logs
      - OPENCANARY_LOG_FILE=/opencanary-logs/opencanary.log
    volumes:
      - netguard_data:/data
      - ./config:/app/config:ro
      - zeek_logs:/zeek-logs:ro
      - opencanary_logs:/opencanary-logs:ro
    ports:
      - "${SYSLOG_PORT:-5140}:5140/udp"
      - "${NETFLOW_PORT:-2055}:2055/udp"
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started   # InfluxDB isteğe bağlı; token yoksa devre dışı
    networks:
      - netguard_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Alembic migration (TimescaleDB hypertable) beklenir

  # ── Frontend: Next.js ──────────────────────────────────────────────
  frontend:
    build:
      context: ./dashboard-v2
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=
        - NEXT_PUBLIC_WS_URL=wss://${NETGUARD_HOST:-localhost}/ws
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netguard_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({hostname:'localhost',port:3000,path:'/api/health',timeout:4000}, r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1)).on('timeout', () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Nginx: TLS reverse proxy ───────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NETGUARD_HOST=${NETGUARD_HOST:-localhost}
    volumes:
      - ssl_certs:/etc/ssl/netguard
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - netguard_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── OpenCanary: Honeypot Tuzak (opsiyonel — profil: honeypot) ──────────────
  opencanary:
    image: thinkst/opencanary:latest
    profiles:
      - honeypot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - opencanary_logs:/var/log/opencanary
    ports:
      - "2000:2000/tcp"
      - "2100:2100/tcp"
      - "3000:3000/tcp"
      - "5000:5000/tcp"
      - "8001:8001/tcp"
      - "13000:13000/udp"
      - "13001:13001/tcp"
    networks:
      - netguard_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  # ── Zeek: Ağ trafiği analiz motoru ───────────────────────────────
  zeek:
    image: zeek/zeek:lts
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - zeek_logs:/zeek-logs
      - ./config/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - ./config/zeek/start.sh:/start.sh:ro
    environment:
      - ZEEK_INTERFACE=${ZEEK_INTERFACE:-eth0}
      - ZEEK_LOG_DIR=/zeek-logs
    entrypoint: ["/bin/sh", "/start.sh"]
    cap_add:
      - NET_ADMIN
      - NET_RAW

  # ── PostgreSQL + TimescaleDB ───────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: netguard
      POSTGRES_USER: netguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netguard_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netguard_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netguard -d netguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── InfluxDB: Zaman serisi metrikleri (isteğe bağlı) ──────────────
  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-influxdb_admin}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-netguard}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-netguard}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - netguard_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  netguard_net:
    driver: bridge

volumes:
  netguard_data:
  influxdb_data:
  postgres_data:
  zeek_logs:
  ssl_certs:
  opencanary_logs:
