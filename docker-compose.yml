services:

  # ── Backend: FastAPI + tüm servisler ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NETGUARD_DB_PATH=/data/netguard.db
      - INFLUXDB_URL=http://influxdb:8086
      - NETGUARD_CORS_ORIGINS=https://localhost,https://127.0.0.1,https://${NETGUARD_HOST:-localhost}
      - NETGUARD_INTERFACE=eth0
      - DATABASE_URL=postgresql://netguard:${POSTGRES_PASSWORD:-netguard_dev}@postgres:5432/netguard
      - ZEEK_LOG_DIR=/zeek-logs
    volumes:
      - netguard_data:/data
      - ./config:/app/config:ro
      - zeek_logs:/zeek-logs:ro
    ports:
      - "${SYSLOG_PORT:-5140}:5140/udp"    # OPNsense / VyOS syslog
      - "${NETFLOW_PORT:-2055}:2055/udp"   # VyOS NetFlow
    cap_add:
      - NET_RAW    # pyshark paket yakalama için
    depends_on:
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - netguard_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend: Next.js ──────────────────────────────────────────────
  frontend:
    build:
      context: ./dashboard-v2
      dockerfile: Dockerfile
      args:
        # Boş = tarayıcı mevcut origin'i kullanır (/api/v1/... → nginx üzerinden backend'e)
        - NEXT_PUBLIC_API_URL=
        # wss:// nginx üzerinden WebSocket — ${NETGUARD_HOST} .env'den gelir
        - NEXT_PUBLIC_WS_URL=wss://${NETGUARD_HOST:-localhost}/ws
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - netguard_net

  # ── Nginx: TLS reverse proxy ───────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NETGUARD_HOST=${NETGUARD_HOST:-localhost}
    volumes:
      - ssl_certs:/etc/ssl/netguard
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - netguard_net

  # ── Zeek: Ağ trafiği analiz motoru (NSM/NDR) ─────────────────────
  zeek:
    image: zeek/zeek:lts
    network_mode: host          # Host arayüzünü doğrudan görür (TAP/SPAN benzeri)
    restart: unless-stopped
    volumes:
      - zeek_logs:/zeek-logs
      - ./config/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - ./config/zeek/start.sh:/start.sh:ro
    environment:
      - ZEEK_INTERFACE=${ZEEK_INTERFACE:-vmnet8}
      - ZEEK_LOG_DIR=/zeek-logs
    entrypoint: ["/bin/sh", "/start.sh"]
    cap_add:
      - NET_ADMIN
      - NET_RAW

  # ── PostgreSQL + TimescaleDB: İlişkisel + zaman serisi loglar ────
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: netguard
      POSTGRES_USER: netguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netguard_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netguard -d netguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - netguard_net

  # ── InfluxDB: Zaman serisi metrikleri ─────────────────────────────
  influxdb:
    image: influxdb:2.7-alpine
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - netguard_net

networks:
  netguard_net:
    driver: bridge

volumes:
  netguard_data:    # SQLite DB + anomaly baselines (geçiş sürecinde korunur)
  influxdb_data:    # InfluxDB zaman serisi metrikleri
  postgres_data:    # PostgreSQL + TimescaleDB (V1-7)
  zeek_logs:        # Zeek JSON log paylaşım alanı (V1-8)
  ssl_certs:        # Nginx self-signed TLS sertifikaları
