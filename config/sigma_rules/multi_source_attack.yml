title: Çok Kaynaklı Koordineli Saldırı
id: multi_source_attack
status: stable
description: >
  Aynı src_ip 5 dakika içinde 2+ farklı kaynak tipinde olay üretir.
  Aynı anda ağ (pyshark), kimlik doğrulama (syslog) ve/veya NetFlow'da
  görünen IP koordineli saldırı göstergesidir.
logsource:
    category: network
    product: netguard
detection:
    selection: {}
    condition: selection | count(distinct source_type) by src_ip > 2
    timeframe: 5m
level: high
tags:
    - attack.reconnaissance
    - attack.t1595
falsepositives:
    - Yetkili güvenlik taramaları
    - Ağ izleme sistemleri (SNMP, NetFlow collector'lar)
