# NetGuard — Suricata Kural Değişiklik Listesi
#
# Format:
#   <SID|regex> "<eski_değer>" "<yeni_değer>"
#
# Sıkça kullanılan dönüşümler:
#   "alert" → "drop"      : Tespit → Engelleme
#   "priority X" → "priority 1" : Öncelik artırma
#
# Kaynaklar: Suricata modify.conf dokümantasyonu, ET Pro rehberi

# ── Yüksek güven: alert → drop ────────────────────────────────────────────
# C2 / Ransomware callback trafik (yanlış pozitif oranı çok düşük)
# re:.*CobaltStrike.* "alert" "drop"
# re:.*Metasploit.* "alert" "drop"
# re:.*ransomware.*callback.* "alert" "drop"

# ── Kritik exploit tespiti → öncelik 1 ───────────────────────────────────
# SQL Injection — web uygulaması önünde suricata varsa aktifleştir
# re:.*SQL.*Injection.* "priority 3" "priority 1"

# ── RCE saldırıları → drop ────────────────────────────────────────────────
# re:.*Remote.*Code.*Execution.* "alert" "drop"
# re:.*Command.*Injection.* "alert" "drop"

# ── NOT: Değişiklikler test ortamında doğrulandıktan sonra aktifleştir ────
# GNS3 lab'da `suricata-update --no-reload` + tcpreplay ile test et
