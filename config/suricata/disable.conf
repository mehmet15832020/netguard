# NetGuard — Suricata Kural Devre Dışı Bırakma Listesi
#
# Format:
#   group:<kategori>     Tüm kategoriyi devre dışı bırak
#   re:<regex>           Regex eşleşen kural başlıklarını devre dışı bırak
#   <SID>                Tek kural (SID numarası)
#   metadata: <field> <value>
#
# Kaynaklar:
#   Emerging Threats FP rehberi, Suricata community forum,
#   CIS Controls v8.1 Safeguard 13.8 (FP yönetimi)
#
# DİKKAT: Her değişiklikten sonra `suricata-update --no-reload` ile test et.

# ── Düşük tehdit / yüksek FP kategorileri ─────────────────────────────────
# Oyun ve chat trafiği — kurumsal ağda genellikle meşru
group:emerging-games
group:emerging-chat

# Bilgi/politika ihlali kuralları — çok gürültülü, yanlış pozitif yüksek
group:emerging-policy
group:emerging-info

# ── Belirli FP-prone kural grupları ───────────────────────────────────────
# DNS TXT kayıt anomali kuralları — CDN/SPF/DKIM kayıtları FP üretir
re:.*DNS.*TXT.*anomaly.*
re:.*DNS.*TXT.*suspicious.*

# Cloudflare / CDN altyapısı FP'leri
re:.*Cloudflare.*
re:.*CDN.*bypass.*

# Windows Update ve Microsoft telemetri (kurumsal ağda normaldir)
re:.*Microsoft.*telemetry.*
re:.*Windows.*Update.*check.*

# ── SMB/Windows ortam FP'leri (iç ağ) ────────────────────────────────────
# İç ağda SMB paylaşımı erişimi normaldir — sadece dış kaynak için aktif bırak
# NOT: Dış kaynaklı SMB trafiği STAGE_MAP'de "lateral" olarak işaretlenir (5140)
re:.*SMB.*internal.*share.*access.*

# ── P2P / torrent kuralları ────────────────────────────────────────────────
# Kurumsal ortamda false positive oranı yüksek
re:.*BitTorrent.*
re:.*P2P.*

# ── NetGuard kendi trafiği FP'leri ─────────────────────────────────────────
# JWT / API-Key Authorization header → Suricata tanımıyor → FP
# NetGuard VM'den kaynaklanan 736 alert bu kurala aitti
re:SURICATA HTTP Request unrecognized authorization method

# ── Spesifik SID devre dışı bırakma örnekleri ────────────────────────────
# (GNS3 lab ortamında test ettikten sonra aktif SID'leri buraya ekle)
# 2019401  # Örnek: Yüksek FP üreten kural
# 2019999  # Örnek: Ortam-spesifik FP
