title: Web Scanner Fingerprint Detected
id: 0d814172-4b04-4ceb-9dd6-86550193a466
status: experimental
description: Known web scanner user agent detected in HTTP logs
logsource:
    category: network
detection:
    selection:
        event_action: http_request
        message|contains:
            - "nikto"
            - "sqlmap"
            - "nessus"
            - "openvas"
            - "masscan"
            - "zgrab"
            - "wfuzz"
            - "dirbuster"
    condition: selection
level: medium
tags:
    - attack.reconnaissance
    - attack.t1595
