---
title: Web Auth Brute Force
id: b1c5f6a7-8d9e-0f1a-2b3c-4d5e6f7a8b9c
correlation:
    type: event_count
    rules: ng_web_auth_brute_base
    group-by:
        - source_ip
    timespan: 5m
    condition:
        gte: 10
level: high
tags:
