title: SSL Certificate Invalid
id: f5a9d0e1-2b3c-4d5e-6f7a-8b9c0d1e2f3a
status: stable
logsource:
    category: network
detection:
    selection:
        event_action: ssl_connection
        message|contains:
            - "certificate has expired"
            - "self signed"
            - "unable to get"
            - "certificate verify failed"
            - "invalid"
    condition: selection
level: medium
tags:
    - attack.command_and_control
    - attack.t1573
