server {
    listen 80;
    server_name 192.168.203.134;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 192.168.203.134;

    ssl_certificate     /etc/ssl/netguard/cert.pem;
    ssl_certificate_key /etc/ssl/netguard/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Agent mTLS (A3) — yalnızca /api/v1/agents/* için istemci sertifikası istenir.
    # "optional": sertifika yoksa bağlantı reddedilmez, backend API-key-only'e düşer
    # (AGENT_MTLS_REQUIRED=true ise backend bunu 401 ile reddeder).
    # nginx >= 1.11.6 "lazy" client cert negotiation ile location bazlı geçerlidir.
    ssl_client_certificate /etc/ssl/netguard/agent-ca.pem;
    ssl_verify_client off;

    # Agent mTLS endpoint'leri — FastAPI/uvicorn
    location /api/v1/agents/metrics {
        ssl_verify_client optional;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host                  $host;
        proxy_set_header   X-Real-IP             $remote_addr;
        proxy_set_header   X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto     $scheme;
        proxy_set_header   X-SSL-Client-Verify   $ssl_client_verify;
        proxy_set_header   X-SSL-Client-CN       $ssl_client_s_dn_cn;
        proxy_set_header   X-SSL-Client-Serial   $ssl_client_serial;
        proxy_read_timeout 60s;
    }

    location /api/v1/agents/security-events {
        ssl_verify_client optional;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host                  $host;
        proxy_set_header   X-Real-IP             $remote_addr;
        proxy_set_header   X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto     $scheme;
        proxy_set_header   X-SSL-Client-Verify   $ssl_client_verify;
        proxy_set_header   X-SSL-Client-CN       $ssl_client_s_dn_cn;
        proxy_set_header   X-SSL-Client-Serial   $ssl_client_serial;
        proxy_read_timeout 60s;
    }

    # API — FastAPI/uvicorn
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket — /ws/* endpoint'leri
    location /ws {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Dashboard — Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Next.js HMR websocket (dev modunda gerekli değil ama zarar vermez)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
